services:
  mysql:
    image: mysql:8.0
    container_name: commerce-mysql
    ports:
      # 보안: localhost(127.0.0.1)에만 바인딩 → 외부 네트워크에서 MySQL 접근 차단(랜섬웨어 노출 차단).
      # host 3307 → container 3306. (호스트 3306은 네이티브 MySQL이 사용 중이라 3307로 매핑)
      - "127.0.0.1:3307:3306"
    environment:
      # 값은 같은 디렉터리의 .env 에서 자동 주입(git 추적 제외). .env.example 참고.
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - commerce-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 브라우저용 DB 뷰어. http://localhost:8081 (앱이 8080을 쓰므로 8081로 게시).
  # 로그인 폼: System=MySQL, Server=mysql(서비스명, 같은 compose 네트워크), DB=commerce.
  adminer:
    image: adminer:4.8.1
    container_name: commerce-adminer
    ports:
      - "127.0.0.1:8081:8080"   # 로컬만 노출 (외부 접근 차단)
    environment:
      ADMINER_DEFAULT_SERVER: mysql   # 로그인 폼 Server 칸 기본값
    depends_on:
      mysql:
        condition: service_healthy

  # 메시지 브로커(RabbitMQ) — 아웃박스 P2b: 폴러가 in-process 대신 RabbitMQ로 발행하고
  # 소비자(@RabbitListener)가 분리 수신한다. '-management' 태그라 관리 웹 UI 플러그인이 켜져 있다.
  #  · 5672  = AMQP 포트(앱이 연결)
  #  · 15672 = 관리 웹 UI (http://localhost:15672, 기본 계정 guest / guest)
  # 기본 계정 guest는 localhost에서만 로그인 가능 → 127.0.0.1 바인딩과 맞아 추가 계정 설정 불필요.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: commerce-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"     # AMQP — 앱이 연결
      - "127.0.0.1:15672:15672"   # 관리 웹 UI
    environment:
      TZ: Asia/Seoul
    volumes:
      - commerce-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 분산 캐시(Redis) — app.cache.provider=redis 일 때만 앱이 연결한다(기본은 in-memory Caffeine이라 불필요).
  # opt-in profile: 기본 `docker compose up -d`에는 안 뜬다(이미 6379를 쓰는 네이티브 Redis와 충돌 방지).
  #   Redis로 시험할 때만 → `docker compose --profile redis up -d redis`. (네이티브 Redis가 이미 있으면 불필요.)
  redis:
    image: redis:7-alpine
    container_name: commerce-redis
    profiles: ["redis"]
    ports:
      - "127.0.0.1:6379:6379"   # 로컬만 노출(외부 차단) — MySQL/RabbitMQ와 동일 정책
    volumes:
      - commerce-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  commerce-mysql-data:
  commerce-rabbitmq-data:
  commerce-redis-data: