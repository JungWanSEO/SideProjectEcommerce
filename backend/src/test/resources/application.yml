# 테스트 전용 설정 — H2 인메모리 (MySQL 없이도 테스트가 독립적으로 돈다)
spring:
  # RabbitMQ·Redis 자동설정 제외 — 테스트엔 브로커/Redis가 없다(캐시는 NoOp). 부팅 시 연결 시도 방지.
  # (Redis 캐시는 런타임 스모크로 검증하고, 실제 통합은 Testcontainers=후속.)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # 테스트는 Flyway(MySQL용 V1 스크립트) 대신 H2 + Hibernate create-drop으로 스키마 생성.
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:commerce;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100   # 운영과 동일하게 N+1 완화 설정 (목록 조회 시 항목 IN 페치)
    show-sql: true

jwt:
  secret: test-secret-key-for-junit-only-0123456789-abcdefghij
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 1209600000

# 아웃박스 폴러는 테스트 중 끈다(@Scheduled가 백그라운드로 도는 것 방지 — 발행은 단위 테스트로 검증).
outbox:
  relay:
    enabled: false

# 캐시는 테스트 기본 OFF(NoOpCacheManager) — "쓰고 바로 읽기"류 테스트가 stale 캐시로 깨지는 것 방지.
# 캐시 적중/무효화는 전용 테스트에서 @TestPropertySource(app.cache.enabled=true)로만 켜서 검증한다.
# 레이트 리밋도 OFF — 공유 카운터가 여러 테스트의 로그인/claim에 누적돼 교차 간섭하는 것 방지(RateLimiterTest는 직접 인스턴스화).
app:
  # 결제 대기 만료 배치 OFF — 켜두면 테스트 도중 10분 경계에 배치가 돌아 다른 테스트의 PENDING 주문을
  #   취소해 버려 간헐적 실패(flaky)를 만든다(아웃박스 폴러와 같은 이유).
  order:
    # 배송비 테스트 기본 OFF(0원) — 기존 결제/취소/정산 테스트의 payable 기대값이 배송비로 흔들리지 않게.
    #   배송비 동작은 ShippingFeeTest에서 @SpringBootTest(properties=...)로 값을 켜서만 검증한다.
    shipping-fee: 0
    free-shipping-threshold: 0
    # 반품 회수비도 기본 OFF(0원) — 기존 반품/환불/정산 테스트의 기대값이 회수비로 흔들리지 않게.
    #   회수비 동작은 ReturnShippingChargeTest에서 @SpringBootTest(properties=...)로 켜서만 검증한다.
    return-shipping-fee: 0
    expiry:
      enabled: false
  # 게스트 카트 정리 배치 OFF — 만료 배치와 같은 이유(테스트가 만든 게스트 카트를 배치가 지워 flaky).
  #   TTL 경계는 GuestCartCleanupServiceTest가 서비스를 직접 호출해 검증한다.
  cart:
    guest-cleanup:
      enabled: false
  # shipment 백필 러너 OFF — 기동 시 자동 소급 생성 방지(백필 로직은 ShipmentBackfillServiceTest로 직접 검증).
  shipment:
    backfill:
      enabled: false
  cache:
    enabled: false
  ratelimit:
    enabled: false