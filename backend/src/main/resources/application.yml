# 서버 포트 — 로컬 8080. 배포 플랫폼(Render/Koyeb 등)이 PORT를 주입하면 그 포트로 바인딩한다.
server:
  port: ${PORT:8080}

spring:
  application:
    name: commerce-api

  # MySQL — 로컬은 Docker(localhost:3307). 배포는 관리형 MySQL 주소를 env로 덮어쓴다:
  #   SPRING_DATASOURCE_URL=jdbc:mysql://<host>:<port>/<db>...  (env > application.yml 우선순위)
  #   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD  (또는 MYSQL_USER/MYSQL_PASSWORD)
  # 시크릿은 OS 환경변수로 주입(12-factor). 로컬은 backend/.env + run.ps1로 로드.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/commerce?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway: 버전관리된 SQL(db/migration/V*.sql)로 스키마를 통제.
  flyway:
    enabled: true
    baseline-on-migrate: true   # 기존(비어있지 않은) DB는 V1로 baseline 표시 후 V2+만 적용. 새 DB는 V1부터 실행.
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway가 만든다 → Hibernate는 엔티티↔스키마 일치만 검증(불일치 시 기동 실패)
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100   # 지연 로딩 컬렉션/프록시를 IN 쿼리로 묶어 N+1 완화 (목록 조회 등)
    show-sql: true

  # 메시지 브로커(RabbitMQ) — 아웃박스 P2b. outbox.publisher=rabbit 일 때만 실제로 사용한다(로컬 Docker 5672).
  # dynamic=false: 기본(in-process) 모드에선 RabbitAdmin 자동 선언/연결을 막아, 브로커가 안 떠 있어도
  #   부팅 시 헛된 연결 시도를 하지 않게 한다. rabbit 모드에선 RabbitConfig가 직접 선언한다.
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    dynamic: false
    listener:
      simple:
        # 소비 실패 시 무한 재큐(hot loop) 방지: 메모리 내 N회 재시도 후 드롭. (운영은 DLQ로 — 후속)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

# 아웃박스 이벤트 발행 방식:
#  · in-process(기본) — 같은 프로세스의 핸들러로 디스패치(InProcessEventPublisher)
#  · rabbit          — RabbitMQ로 발행하고 소비자(@RabbitListener)가 분리 수신(RabbitEventPublisher)
outbox:
  publisher: in-process

# JWT 설정. secret은 OS 환경변수(JWT_SECRET)로 주입 — 코드/깃에 시크릿을 두지 않는다.
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 1800000      # 30분
  refresh-token-validity-ms: 1209600000  # 14일

# 앱 배포 설정 — 로컬 기본값, 운영은 env로 덮어쓴다.
app:
  # 캐시 켜기(운영/로컬 기본). 테스트는 src/test 설정에서 false로 꺼 캐시가 테스트 결정성을 깨지 않게 한다.
  cache:
    enabled: true
  cors:
    # 브라우저 호출을 허용할 FE origin(콤마 구분). 운영: APP_CORS_ALLOWED_ORIGINS=https://<your-app>.vercel.app
    allowed-origins: http://localhost:3000
  cookie:
    # FE/BE 도메인이 다른 배포(크로스사이트)에선 운영에서 secure=true, same-site=None 이어야 로그인 쿠키가 실린다.
    #   운영: APP_COOKIE_SECURE=true · APP_COOKIE_SAME_SITE=None
    secure: false
    same-site: Lax