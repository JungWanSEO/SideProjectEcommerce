# 서버 포트 — 로컬 8080. 배포 플랫폼(Render/Koyeb 등)이 PORT를 주입하면 그 포트로 바인딩한다.
server:
  port: ${PORT:8080}
  # 리버스 프록시(Caddy/nginx) 뒤에선 X-Forwarded-Proto/Host를 신뢰해 외부 https 도메인으로 URL을 생성한다.
  #   특히 OAuth2 인가요청의 redirect_uri({baseUrl}/login/oauth2/code/*)가 내부 http://…:8080이 아니라
  #   실제 https 도메인으로 만들어져야 소셜 로그인이 provider 등록 URI와 일치한다.
  #   로컬(프록시 없음)=none. 배포(Caddy 뒤)=SERVER_FORWARD_HEADERS_STRATEGY=framework.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    mbeanregistry:
      enabled: true   # Tomcat 스레드 풀 MBean 등록 → Micrometer tomcat.threads.* 메트릭 노출(관측성)

spring:
  application:
    name: commerce-api

  # MySQL — 로컬은 Docker(localhost:3307). 배포는 관리형 MySQL 주소를 env로 덮어쓴다:
  #   SPRING_DATASOURCE_URL=jdbc:mysql://<host>:<port>/<db>...  (env > application.yml 우선순위)
  #   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD  (또는 MYSQL_USER/MYSQL_PASSWORD)
  # 시크릿은 OS 환경변수로 주입(12-factor). 로컬은 backend/.env + run.ps1로 로드.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/commerce?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    # 배포는 SPRING_DATASOURCE_USERNAME/_PASSWORD(deploy.md §5)를 1급으로 쓰고, 없으면 로컬 컨벤션 MYSQL_USER/_PASSWORD로 폴백.
    #   둘 다 없으면 안쪽 ${MYSQL_USER}가 기본값이 없어 부팅 실패(fail-fast) — 시크릿 누락을 조용히 넘기지 않는다.
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis 접속 — app.cache.provider=redis 일 때만 실제 연결(기본 caffeine이면 연결 안 함).
  # 배포 시 REDIS_HOST/REDIS_PORT(또는 SPRING_DATA_REDIS_*)로 덮어쓴다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        max-page-size: 100   # 페이지 size 상한(남용·과다조회 방지). 초과 요청해도 100으로 제한.

  # ⚠️ 소셜 로그인은 spring.security.oauth2.client.* 를 쓰지 않는다 — Boot가 비어있는 registration도
  #   검증해 "client id must not be empty"로 부팅 실패시키기 때문(provider별 opt-in 불가). 대신 자격증명을
  #   app.oauth2.* 로 받아 OAuth2ClientConfig가 값이 있는 provider만 골라 ClientRegistrationRepository를 만든다.

  # Flyway: 버전관리된 SQL(db/migration/V*.sql)로 스키마를 통제.
  flyway:
    enabled: true
    baseline-on-migrate: true   # 기존(비어있지 않은) DB는 V1로 baseline 표시 후 V2+만 적용. 새 DB는 V1부터 실행.
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway가 만든다 → Hibernate는 엔티티↔스키마 일치만 검증(불일치 시 기동 실패)
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100   # 지연 로딩 컬렉션/프록시를 IN 쿼리로 묶어 N+1 완화 (목록 조회 등)
    show-sql: true

  # 메시지 브로커(RabbitMQ) — 아웃박스 P2b. outbox.publisher=rabbit 일 때만 실제로 사용한다(로컬 Docker 5672).
  # dynamic=false: 기본(in-process) 모드에선 RabbitAdmin 자동 선언/연결을 막아, 브로커가 안 떠 있어도
  #   부팅 시 헛된 연결 시도를 하지 않게 한다. rabbit 모드에선 RabbitConfig가 직접 선언한다.
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    dynamic: false
    listener:
      simple:
        # 소비 실패 시 무한 재큐(hot loop) 방지: 메모리 내 N회 재시도 후 드롭. (운영은 DLQ로 — 후속)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

# 아웃박스 이벤트 발행 방식:
#  · in-process(기본) — 같은 프로세스의 핸들러로 디스패치(InProcessEventPublisher)
#  · rabbit          — RabbitMQ로 발행하고 소비자(@RabbitListener)가 분리 수신(RabbitEventPublisher)
outbox:
  publisher: in-process

# JWT 설정. secret은 OS 환경변수(JWT_SECRET)로 주입 — 코드/깃에 시크릿을 두지 않는다.
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 1800000      # 30분
  refresh-token-validity-ms: 1209600000  # 14일

# Actuator: 운영 모니터링 엔드포인트. metrics/caches/prometheus 노출.
#   예: /actuator/metrics/cache.gets?tag=cache:productDetail · /actuator/caches · /actuator/prometheus(Prometheus 스크레이프)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, caches, prometheus
  metrics:
    tags:
      application: commerce-api   # 모든 메트릭에 application 라벨 부여(여러 앱 구분)
    distribution:
      # http 요청 응답시간에 히스토그램 버킷을 발행 → Prometheus histogram_quantile로 p95/p99 계산 가능.
      # (기본은 count/sum만 나와 분위수를 못 구한다.) 점 포함 키는 [] 로 감싸야 중첩 키로 안 쪼개진다.
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 50ms, 100ms, 200ms, 400ms, 800ms, 1s, 2s

# 앱 배포 설정 — 로컬 기본값, 운영은 env로 덮어쓴다.
app:
  # 캐시 켜기(운영/로컬 기본). 테스트는 src/test 설정에서 false로 꺼 캐시가 테스트 결정성을 깨지 않게 한다.
  cache:
    enabled: true
    # caffeine(기본·인메모리, 외부 0) | redis(분산 — docker-compose redis 필요, 다중 인스턴스 캐시 공유)
    provider: ${APP_CACHE_PROVIDER:caffeine}
  # 분산락 구현: none(기본·락 없음, 선착순은 DB 원자 UPDATE가 보증) | redis(DIY SETNX+Lua) | redisson(RLock watchdog).
  lock:
    provider: ${APP_LOCK_PROVIDER:none}
    # DIY(redis) 락 튜닝 — 고경합에선 spin 간격이 핸드오프 처리량을 좌우(부하 실험). spin↓이면 핸드오프↑·Redis 폴링↑.
    redis:
      spin-interval-ms: ${APP_LOCK_REDIS_SPIN_INTERVAL_MS:50}
      wait-ms: ${APP_LOCK_REDIS_WAIT_MS:3000}
      lease-ms: ${APP_LOCK_REDIS_LEASE_MS:5000}
  # 레이트 리밋. 운영/로컬 ON, 테스트는 OFF(공유 카운터의 교차 간섭 방지).
  ratelimit:
    enabled: ${APP_RATELIMIT_ENABLED:true}
    # 구현: memory(기본·인메모리 고정 윈도우) | redis(DIY 슬라이딩 윈도우 Lua) | redisson(토큰 버킷 RRateLimiter)
    provider: ${APP_RATELIMIT_PROVIDER:memory}
  cors:
    # 브라우저 호출을 허용할 FE origin(콤마 구분). 운영: APP_CORS_ALLOWED_ORIGINS=https://<your-app>.vercel.app
    allowed-origins: http://localhost:3000
  cookie:
    # FE/BE 도메인이 다른 배포(크로스사이트)에선 운영에서 secure=true, same-site=None 이어야 로그인 쿠키가 실린다.
    #   운영: APP_COOKIE_SECURE=true · APP_COOKIE_SAME_SITE=None
    secure: false
    same-site: Lax
  # 소셜 로그인 성공 후 브라우저를 돌려보낼 FE 주소(쿠키는 이미 심겨 로그인 상태). 운영: APP_OAUTH2_REDIRECT=https://<your-app>.vercel.app
  oauth2:
    success-redirect-url: ${APP_OAUTH2_REDIRECT:http://localhost:3000}
    # 소셜 로그인 자격증명 — provider별 opt-in(client-id 있는 provider만 OAuth2ClientConfig가 활성화).
    #   둘 다 비면 소셜 로그인 비활성(기존 로컬 로그인만). 리다이렉트 URI: {baseUrl}/login/oauth2/code/{provider}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}