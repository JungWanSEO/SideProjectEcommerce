# 로컬 개발(dev) 프로파일 — run.ps1이 SPRING_PROFILES_ACTIVE=dev로 띄운다.
#
# 여기 있는 값은 application.yml의 기본값을 "로컬에서만" 덮는다. 시크릿·접속정보는 여전히 .env(OS 환경변수)로.
app:
  # 데모 시드 ON — 로컬은 기동만 하면 카탈로그·셀러·데모 주문이 채워져 화면이 곧장 보인다.
  #   (기본값은 OFF다. 운영에서 켤 땐 APP_DEMO_SEED_ENABLED=true로 명시 — 실수로 실데이터 DB에 섞이지 않게.)
  demo-seed:
    enabled: true
    # 로컬 편의 — 어드민 화면(대시보드·정산·감사로그)을 바로 열어보도록 admin@commerce.com 계정을 만든다.
    #   운영에는 기본값이 없다(비우면 계정 자체를 안 만듦) — 공개 데모에 "누구나 아는 관리자"를 두지 않기 위함.
    admin-password: demopass1234
