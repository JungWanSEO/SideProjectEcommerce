# Grafana 데이터소스 자동 등록 — Prometheus 컨테이너(같은 compose 네트워크의 prometheus:9090).
# uid 를 고정(prometheus)해 대시보드 JSON이 이 uid로 참조한다.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
