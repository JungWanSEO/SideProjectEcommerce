# 프로덕션 compose — 경로 A(Oracle Always Free VM) 전용.
# 로컬 dev용 docker-compose.yml(앱은 호스트 run.ps1, MySQL만 컨테이너)과 달리,
#   여기선 앱까지 Dockerfile로 빌드해 컨테이너로 띄우고 MySQL과 같은 compose 네트워크로 묶는다.
#
# VM에서 실행:
#   1) .env.prod.example → .env.prod 복사 후 값 채우기 (시크릿·CORS·도메인)
#   2) docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   3) 앱은 127.0.0.1:8080 에만 바인딩 → 호스트의 Caddy/nginx가 HTTPS로 리버스 프록시(외부 노출은 프록시만).
#
# 첫 기동 시 Flyway가 V1~최신 마이그레이션을 새 MySQL에 적용한다.
services:
  mysql:
    image: mysql:8.0
    container_name: commerce-mysql
    restart: unless-stopped
    # 외부 포트 매핑 없음 — 같은 compose 네트워크의 app 컨테이너에서만 접근(DB를 인터넷에 노출하지 않는다).
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - commerce-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commerce-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 앱→MySQL: 호스트가 아니라 compose 네트워크의 서비스명 mysql:3306 (로컬의 3307 매핑과 무관).
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 브라우저에서 호출할 FE origin(들). 콤마로 여러 개. 예: https://myapp.vercel.app
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      # HTTPS 프로덕션이므로 secure=true. SameSite=None이면 크로스사이트·같은사이트 둘 다 커버(Secure 필수 쌍).
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_COOKIE_SAME_SITE: ${APP_COOKIE_SAME_SITE:-None}
      # Caddy 리버스 프록시 뒤 → X-Forwarded-* 신뢰(OAuth2 redirect_uri가 외부 https 도메인으로 생성되게).
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      # 소셜 로그인 성공 후 돌아갈 FE 주소(소셜 켤 때 필수). 안 켜면 무시됨.
      APP_OAUTH2_REDIRECT: ${APP_OAUTH2_REDIRECT:-}
      # 데모 시드(빈 사이트 방지). 비우려면 .env.prod에서 지운다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # 소셜 로그인 자격증명(선택 — 비우면 소셜 비활성, 로컬 로그인만).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      TZ: Asia/Seoul
    ports:
      # 호스트 루프백에만 노출 → Caddy/nginx(호스트)가 HTTPS 종단 후 여기로 프록시. 인터넷 직접 노출 금지.
      - "127.0.0.1:8080:8080"

volumes:
  commerce-mysql-data:
